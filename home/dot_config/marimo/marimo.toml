[diagnostics]

[server]
browser = "default"
follow_symlink = false

[runtime]
auto_instantiate = true
default_auto_download = []
std_stream_max_bytes = 1000000
reactive_tests = true
watcher_on_save = "lazy"
auto_reload = "off"
on_cell_change = "lazy"
output_max_bytes = 8000000
default_sql_output = "auto"

[formatting]
line_length = 80

[snippets]
custom_paths = []
include_default_snippets = true

[ai]
mode = "manual"
rules = ""
[ai.models]
displayed_models = []
custom_models = []

[experimental]

[package_management]
manager = "uv"

[save]
autosave_delay = 1000
format_on_save = true
autosave = "after_delay"

[completion]
activate_on_typing = true
copilot = false

[display]
code_editor_font_size = 14
reference_highlighting = false
default_width = "full"
default_table_page_size = 10
dataframes = "rich"
default_table_max_columns = 50
cell_output = "above"
theme = "dark"

[keymap]
destructive_delete = true
preset = "default"
[keymap.overrides]

[language_servers.basedpyright]

[language_servers.ty]

[language_servers.pylsp]
enable_pyflakes = false
enabled = true
enable_flake8 = false
enable_ruff = true
enable_pydocstyle = false
enable_mypy = true
enable_pylint = false
